    <g fill="none" stroke="#8b7953" stroke-linecap="round" stroke-linejoin="round" opacity=".24" transform="translate(1.2 2.2)">
      <path d="M217 277 C205 238 205 200 216 162 C224 135 237 111 253 91" stroke-width="4"/>
      <path d="M215 185 C183 175 159 157 145 132 C176 126 205 139 219 162" stroke-width="3"/>
      <path d="M211 219 C245 205 273 180 291 146 C257 142 228 157 214 183" stroke-width="3"/>
