    <ellipse cx="220" cy="184" rx="118" ry="128" fill="none" stroke="#9c8c6c" stroke-width="1.2" opacity=".25" stroke-dasharray="2 8"/>
    <g fill="#373835" font-family="Courier New, monospace">
      <text x="80" y="45" font-size="12" letter-spacing="2.2">small enough to remember</text>
      <text x="310" y="330" font-size="10" letter-spacing="1.4" opacity=".68">fingerprints, fibre, pause</text>
    </g>
